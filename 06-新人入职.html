<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 - 新人入职指南</title>
<style>
  :root{--primary:#0b5cad;--primary-dark:#073d75;--bg:#f6f8fb;--card:#fff;
        --border:#dde3ec;--text:#1f2d3d;--muted:#6b7a90;--warn:#d98014}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
       color:var(--text);background:var(--bg);line-height:1.75;font-size:15px}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
         padding:20px 40px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  header .crumb{font-size:12px;opacity:.85}
  header .crumb a{color:#fff;text-decoration:underline}
  header h1{margin:6px 0 0;font-size:22px}
  header .meta{opacity:.9;font-size:13px;margin-top:4px}
  main{max-width:1000px;margin:20px auto;padding:0 24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;
        padding:32px 28px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);
        min-height:380px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
         height:340px;color:var(--muted);text-align:center}
  .empty .icon{font-size:42px;margin-bottom:12px;opacity:.5}
  .empty .t{font-size:16px;color:var(--warn);font-weight:600}
  .empty .s{font-size:13px;margin-top:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="crumb"><a href="规范总览.html">🏠 知识库首页</a> &nbsp;›&nbsp; 06 新人入职</div>
  <h1>06 · 新人入职指南</h1>
</header>

<main>
  <div class="card">
    <div class="empty">
      <div class="icon">📝</div>
      <div class="t">本章节内容待补充</div>
      <div class="s">请在此处编辑新人入职相关内容</div>
    </div>
  </div>
</main>

<footer>© 汽车诊断软件开发团队 · 内部资料</footer>
</body>
</html>
